site_name: diff-contract
# site_description is what makes the <meta name="description"> tag appear in the
# built HTML. Without it the build is still green but the tag is absent, so search
# engines have no snippet to show. The value mirrors the description field in
# pyproject.toml.
site_description: Deterministic guardrails for AI-generated diffs — define what files can change, block violations.
# site_url is what makes the deployed sitemap.xml and canonical URLs correct.
# Without it mkdocs emits an EMPTY <urlset/> and the whole site disappears from
# sitemap-based discovery -- a green build that ships nothing.
site_url: https://yunaremaia.github.io/diff-contract/
repo_name: yunaremaia/diff-contract
repo_url: https://github.com/yunaremaia/diff-contract
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tracking
    - navigation.tabs
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Usage: usage.md
  - Rules: rules.md
  - Configuration: configuration.md
  - CI: ci.md
  - API Reference: api.md

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yunaremaia/diff-contract
