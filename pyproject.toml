[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diff-contract"
version = "0.1.0"
description = "Deterministic guardrails for AI-generated diffs — define what files can change, block violations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Yunare Maia", email = "yunare@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.5", "types-PyYAML"]

[project.scripts]
diff-contract = "diff_contract.cli:main"

[project.urls]
Homepage = "https://github.com/yunaremaia/diff-contract"

[tool.setuptools.packages.find]
where = ["src"]
include = ["diff_contract*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
PYTHONDONTWRITEBYTECODE = 1

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
