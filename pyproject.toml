[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diff-contract"
version = "0.1.6"
description = "Deterministic guardrails for AI-generated diffs — define what files can change, block violations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Yunare Maia", email = "yunare@gmail.com" },
]
keywords = [
    "ai-generated-code",
    "ai-agents",
    "code-review",
    "ci",
    "developer-tools",
    "diff",
    "github-actions",
    "guardrails",
    "policy",
    "pre-commit",
    "pull-request",
    "sarif",
    "static-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Version Control",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.16.10", "types-PyYAML"]

[project.scripts]
diff-contract = "diff_contract.cli:main"

[project.urls]
Homepage = "https://yunaremaia.github.io/diff-contract/"
Documentation = "https://yunaremaia.github.io/diff-contract/"
Source = "https://github.com/yunaremaia/diff-contract"
Repository = "https://github.com/yunaremaia/diff-contract"
Issues = "https://github.com/yunaremaia/diff-contract/issues"
Funding = "https://github.com/sponsors/yunaremaia"
Changelog = "https://github.com/yunaremaia/diff-contract/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["diff_contract*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
PYTHONDONTWRITEBYTECODE = 1

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
