name: 'diff-contract'
description: 'Deterministic guardrails for AI-generated diffs — block changes outside allowed scope'
branding:
  icon: 'shield'
  color: 'red'
inputs:
  contract:
    description: 'Path to .diffcontract.yml'
    required: false
    default: '.diffcontract.yml'
  base:
    description: 'Base branch to diff against'
    required: false
    default: 'main'
  github-token:
    description: 'GitHub token'
    required: false
    default: ${{ github.token }}
  format:
    description: 'Output format (text, json, sarif)'
    required: false
    default: 'text'
  sarif-output:
    description: 'SARIF output file path'
    required: false
    default: 'diff-contract.sarif'
runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install diff-contract
      shell: bash
      run: pip install diff-contract

    - name: Run diff-contract check
      shell: bash
      run: |
        if [ "${{ inputs.format }}" = "sarif" ]; then
          diff-contract check --contract ${{ inputs.contract }} --base ${{ inputs.base }} --sarif > ${{ inputs.sarif-output }}
        elif [ "${{ inputs.format }}" = "json" ]; then
          diff-contract check --contract ${{ inputs.contract }} --base ${{ inputs.base }} --output json
        else
          diff-contract check --contract ${{ inputs.contract }} --base ${{ inputs.base }}
        fi

    - name: Upload SARIF
      if: inputs.format == 'sarif' && always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-output }}
